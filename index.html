<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="stylesheet" href="https://use.typekit.net/qqu3acy.css">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- PWA/Safari full-height support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    <title>Multifaceted Designer</title>
    
    <!-- CRITICAL: Immediate loader styles that render BEFORE React -->
    <style>
      /* Reset and base styles */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        background-color: #050505;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        overflow: hidden;
      }
      
      /* IMMEDIATE LOADER - Shows instantly before React loads */
      #immediate-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        /* Use new viewport units so loader fills behind floating chrome */
        min-height: 100svh; /* when toolbars expanded */
        min-height: 100dvh; /* dynamic as chrome hides/shows */
        background-color: #050505;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 100000;
        opacity: 1;
        transition: opacity 0.3s ease;
        padding-top: env(safe-area-inset-top);
        padding-right: env(safe-area-inset-right);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        box-sizing: border-box;
      }

      @supports (height: 100lvh) {
        /* In standalone mode, Safari prefers the large viewport */
        #immediate-loader { min-height: 100lvh; }
      }
      
      #immediate-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      
      /* Loader title */
      .loader-title {
        font-size: clamp(1.5rem, 5vw, 2.5rem);
        font-weight: 600;
        background: linear-gradient(135deg, #64ffda 0%, #bb86fc 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 2rem;
        text-align: center;
      }
      
      /* Progress container */
      .progress-container {
        width: 90%;
        max-width: 400px;
        margin-bottom: 1rem;
      }

      .radial-progress {
        width: 160px;
        height: 160px;
        margin: 0 auto 1rem;
        position: relative;
      }

      .radial-progress svg {
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
      }

      .ring-bg {
        fill: none;
        stroke: rgba(255, 255, 255, 0.1);
        stroke-width: 8;
      }

      .ring {
        fill: none;
        stroke-width: 8;
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        transition: stroke-dashoffset 0.3s ease;
      }

      .start-ring { stroke: #64ffda; }
      .assets-ring { stroke: #bb86fc; }
      .test-ring { stroke: #ffa726; }

      .radial-center {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .progress-phase {
        color: #fff;
        font-weight: 600;
      }

      .progress-percent {
        color: rgba(255, 255, 255, 0.7);
        font-size: 0.8rem;
      }

      /* Current asset display */
      .current-asset {
        text-align: center;
        color: rgba(255, 255, 255, 0.5);
        font-size: 0.75rem;
        height: 1rem;
        overflow: hidden;
        margin-top: 0.5rem;
      }
      
      /* Loading animation dots */
      .loading-dots {
        margin-top: 1rem;
        display: flex;
        gap: 4px;
      }
      
      .loading-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #64ffda;
        animation: pulse 1.5s ease-in-out infinite alternate;
        opacity: 0.7;
      }
      
      .loading-dot:nth-child(2) {
        animation-delay: 0.2s;
      }
      
      .loading-dot:nth-child(3) {
        animation-delay: 0.4s;
      }
      
      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(0.8); }
        100% { opacity: 1; transform: scale(1.2); }
      }
      
      /* Hide root initially */
      #root {
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      
      #root.ready {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <!-- IMMEDIATE LOADER - Shows instantly before any JavaScript runs -->
    <div id="immediate-loader">
      <div class="loader-title">Multifaceted Designer</div>
      
      <div class="progress-container">
        <div class="radial-progress">
          <svg viewBox="0 0 160 160">
            <circle class="ring-bg" cx="80" cy="80" r="70" pathLength="100" />
            <circle class="ring start-ring" id="ring-start" cx="80" cy="80" r="70" pathLength="100" />
            <circle class="ring-bg" cx="80" cy="80" r="55" pathLength="100" />
            <circle class="ring assets-ring" id="ring-assets" cx="80" cy="80" r="55" pathLength="100" />
            <circle class="ring-bg" cx="80" cy="80" r="40" pathLength="100" />
            <circle class="ring test-ring" id="ring-test" cx="80" cy="80" r="40" pathLength="100" />
          </svg>
          <div class="radial-center">
            <div class="progress-phase" id="progress-phase">Starting Application</div>
            <div class="progress-percent" id="progress-percent">0%</div>
          </div>
        </div>
        <div class="current-asset" id="current-asset">Starting up...</div>
        <div class="current-asset" id="testing-info" style="margin-top:4px"></div>
      </div>
      
      <div class="loading-dots">
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
      </div>
    </div>
    
    <!-- React root - hidden initially -->
    <div id="root"></div>
    
    <!-- CRITICAL: Update loader from JavaScript -->
    <script type="module">
      // Global functions to update the immediate loader
      window.updateImmediateLoader = function({ start = null, assets = null, test = null, phase, currentAsset }) {
        const ringStart = document.getElementById('ring-start');
        const ringAssets = document.getElementById('ring-assets');
        const ringTest = document.getElementById('ring-test');
        const testingInfo = document.getElementById('testing-info');
        const progressPhase = document.getElementById('progress-phase');
        const progressPercent = document.getElementById('progress-percent');
        const currentAssetEl = document.getElementById('current-asset');

        window.__phaseProgress = window.__phaseProgress || { start: 0, assets: 0, test: 0 };

        if (typeof start === 'number') window.__phaseProgress.start = start;
        if (typeof assets === 'number') window.__phaseProgress.assets = assets;
        if (typeof test === 'number') window.__phaseProgress.test = test;

        if (ringStart) ringStart.style.strokeDashoffset = 100 - window.__phaseProgress.start;
        if (ringAssets) ringAssets.style.strokeDashoffset = 100 - window.__phaseProgress.assets;
        if (ringTest) ringTest.style.strokeDashoffset = 100 - window.__phaseProgress.test;

        if (progressPhase) {
          progressPhase.textContent = phase || 'Loading...';
        }

        let displayProgress = window.__phaseProgress.start;
        if (phase === 'Loading Assets') displayProgress = window.__phaseProgress.assets;
        else if (phase === 'Testing Performance') displayProgress = window.__phaseProgress.test;
        if (progressPercent) {
          progressPercent.textContent = Math.round(displayProgress) + '%';
        }

        if (testingInfo && phase === 'Testing Performance') {
          testingInfo.textContent = currentAsset || '';
          if (currentAssetEl) currentAssetEl.textContent = '';
        } else {
          if (currentAssetEl) currentAssetEl.textContent = currentAsset || '';
          if (testingInfo) testingInfo.textContent = '';
        }

        if (import.meta.env.DEV) console.log('📊 Immediate loader updated:', { start, assets, test, phase, currentAsset });
      };
      
      // Hide immediate loader and show React app
      window.showReactApp = function() {
        const immediateLoader = document.getElementById('immediate-loader');
        const root = document.getElementById('root');
        
        if (immediateLoader) {
          immediateLoader.classList.add('hidden');
          setTimeout(() => {
            immediateLoader.style.display = 'none';
          }, 300);
        }
        
        if (root) {
          root.classList.add('ready');
        }
        
        // Body overflow remains hidden; scrolling handled within app container
        
        if (import.meta.env.DEV) console.log('✅ React app is now visible, immediate loader hidden');
      };
      
      // Initial update
      window.updateImmediateLoader({ start: 0, assets: 0, test: 0, phase: 'Starting Application', currentAsset: 'Starting application...' });

      // Simulate script loading progress until React takes over
      let __startSimProgress = 0;
      const __startSimInterval = setInterval(() => {
        __startSimProgress =
          __startSimProgress < 90
            ? Math.min(__startSimProgress + 2, 90)
            : Math.min(__startSimProgress + 0.5, 99);
        window.updateImmediateLoader({
          start: __startSimProgress,
          phase: 'Starting Application',
          currentAsset: 'Loading scripts...'
        });
      }, 100);

      // Allow React to stop the simulation once it loads
      window.stopStartProgress = () => clearInterval(__startSimInterval);
    </script>
    
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
