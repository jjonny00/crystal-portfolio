<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Section Catalog</title>
    <link rel="stylesheet" href="https://use.typekit.net/qqu3acy.css" />

    <!-- Paints the first frame in the catalogue's dark tone before the CSS
         arrives. Unlike index.html this page scrolls the document, so no
         overflow is locked here. -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-variation-settings: "wdth" var(--wdth, 100);
      }

      body {
        background-color: #282828;
        color: white;
        font-family: "acumin-variable", sans-serif;
        font-weight: 300;
        font-stretch: 87.5%;
        --wdth: 87.5;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="module" src="/src/catalog-main.jsx"></script>
  </body>
</html>
